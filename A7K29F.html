<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школа №1</title>
  <link rel="stylesheet" href="A7K29F.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="/images/ЛОГО СИНИЙ.png" type="image/x-icon">
</head>
<body>

  <header>
    <div class="header_container">
      <img src="images/ЛОГО СИНИЙ.png" alt="Школьная демократия" class="logo">
      <p class="header_text">ШКОЛЬНАЯ ДЕМОКРАТИЯ</p>
    </div>
  </header>

  <h2 class="golosovanie">Голосование</h2>

  <div class="poll-container" id="pollContainer">
    <div class="poll-content">
      <h2 class="poll-question">Что можно добавить в школу?</h2>

      <div class="poll-options">
        <label class="poll-option" data-value="musica">
          <input type="checkbox" name="poll" value="musica" class="poll-checkbox">
          <span class="custom-checkbox">
            <svg width="12px" height="10px" viewBox="0 0 12 10">
              <polyline points="1.5 6 4.5 9 10.5 1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" fill="none" stroke="white"></polyline>
            </svg>
          </span>
          <span class="option-text">Музыка на переменах</span>
          <span class="poll-option-percent"></span>
        </label>

        <label class="poll-option" data-value="disco">
          <input type="checkbox" name="poll" value="disco" class="poll-checkbox">
          <span class="custom-checkbox">
            <svg width="12px" height="10px" viewBox="0 0 12 10">
              <polyline points="1.5 6 4.5 9 10.5 1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" fill="none" stroke="white"></polyline>
            </svg>
          </span>
          <span class="option-text">Дискотеки перед каникулами</span>
          <span class="poll-option-percent"></span>
        </label>

        <label class="poll-option" data-value="event">
          <input type="checkbox" name="poll" value="event" class="poll-checkbox">
          <span class="custom-checkbox">
            <svg width="12px" height="10px" viewBox="0 0 12 10">
              <polyline points="1.5 6 4.5 9 10.5 1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" fill="none" stroke="white"></polyline>
            </svg>
          </span>
          <span class="option-text">Расписание мероприятий</span>
          <span class="poll-option-percent"></span>
        </label>
      </div>

      <div class="poll-slider-wrapper">
        <div class="slider-container">
          <div class="slider">
            <div class="slider-track" id="pollSliderTrack">
              <div class="slider-thumb" id="pollSliderThumb">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z" fill="white"/>
                </svg>
              </div>
              <span class="slider-text" id="pollSliderText">Проведи, чтобы проголосовать</span>
              <div class="slider-text-mask" id="pollSliderTextMask">
                <span class="slider-text" id="pollSliderTextMasked"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="complaint-container">
    <h2 class="complaint-title">Оставить жалобу или предложение</h2>
    <form id="complaintForm" class="complaint-form">
      <div class="form-group">
        <label for="complaintName">Имя (можно не указывать)</label>
        <input type="text" id="complaintName" name="name" placeholder="Как к тебе обращаться?" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="complaintText">Текст жалобы</label>
        <textarea id="complaintText" name="text" rows="5" placeholder="Опиши проблему подробно..." required></textarea>
      </div>
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />
      <button type="submit" id="complaintSubmit" class="complaint-btn">Отправить анонимно</button>
      <p id="complaintMessage" class="complaint-message"></p>
    </form>
  </div>

  <script src="/A7K29F.js"></script>
  <script src="/complaint.js"></script>
</body>
</html>
